<text x="40" y="110" class="m" font-size="20"><tspan fill="#6FB8FF">~/Desktop</tspan><tspan fill="#FFD400"> ❯ </tspan><tspan fill="#E8E8EE">/zap convert every png in this folder to jpg</tspan></text><text x="64" y="156" class="m" font-size="20"><tspan fill="#FFD400">⚡</tspan><tspan fill="#FFFFFF" font-weight="700"> for f in *.png; do sips -s format jpeg "$f" --out "${f%.png}.jpg"; done</tspan></text><text x="40" y="196" class="m" font-size="18" fill="#8A8A94">/Users/louai/Desktop/shots/one.png</text><text x="40" y="224" class="m" font-size="18" fill="#8A8A94">  /Users/louai/Desktop/shots/one.jpg</text><text x="40" y="278" class="m" font-size="20"><tspan fill="#6FB8FF">~/Desktop</tspan><tspan fill="#FFD400"> ❯ </tspan><tspan fill="#E8E8EE">/zap delete every node_modules folder in ~/Projects</tspan></text><text x="64" y="324" class="m" font-size="20"><tspan fill="#FF5F57">⚡</tspan><tspan fill="#FF6B63" font-weight="700"> find ~/Projects -name node_modules -type d -prune -exec rm -rf {} +</tspan></text><text x="64" y="364" class="m" font-size="20"><tspan fill="#FF5F57" font-weight="700">careful:</tspan><tspan fill="#FF6B63"> this can delete or change things you can't get back.</tspan></text><text x="64" y="394" class="m" font-size="20" fill="#C8C8D0">type <tspan font-weight="700" fill="#fff">yes</tspan> to run it, <tspan font-weight="700" fill="#fff">e</tspan> to edit, anything else cancels: <tspan fill="#FFD400">▌</tspan></text><text x="40" y="450" class="m" font-size="20"><tspan fill="#6FB8FF">~/Desktop</tspan><tspan fill="#FFD400"> ❯ </tspan><tspan fill="#E8E8EE">/zap what's eating my disk space?</tspan></text>
